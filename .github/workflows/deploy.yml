name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: eu-west-2

jobs:
  # Runs on every PR and push - catches broken Terraform before it touches AWS
  terraform-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform init
        working-directory: terraform
        run: terraform init
      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Terraform plan
        working-directory: terraform
        run: terraform plan
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_cognito_domain_prefix: ${{ secrets.COGNITO_DOMAIN_PREFIX }}
          TF_VAR_oauth_callback_urls: ${{ secrets.OAUTH_CALLBACK_URLS }}

  # Only runs on main - applies infra, then syncs the built frontend + invalidates the cache
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: terraform-plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform apply
        working-directory: terraform
        run: |
          terraform init
          terraform apply -auto-approve
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_cognito_domain_prefix: ${{ secrets.COGNITO_DOMAIN_PREFIX }}
          TF_VAR_oauth_callback_urls: ${{ secrets.OAUTH_CALLBACK_URLS }}

      # index.html/app.js/styles.css are uploaded by the `frontend` module
      # itself (aws_s3_object resources), so `terraform apply` already
      # deployed the latest frontend - this just busts the CDN cache.
      - name: Invalidate CloudFront cache
        working-directory: terraform
        run: |
          DIST_ID=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || true)
          if [ -n "$DIST_ID" ]; then
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          fi
